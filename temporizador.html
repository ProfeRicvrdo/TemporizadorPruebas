<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporizador de prueba</title>
<style>
:root{--bg:#f4f5f7;--fg:#14171c;--muted:#5d6673;--card:#ffffff;--line:#d5d9e0;--ok:#16794a;--warn:#b86e00;--bad:#c62828;--accent:#2457d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#f2f4f8;--muted:#9aa4b2;--card:#171b22;--line:#2b323d;--ok:#4ade80;--warn:#fbbf24;--bad:#ff5a5a;--accent:#6e9bff}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#f2f4f8;--muted:#9aa4b2;--card:#171b22;--line:#2b323d;--ok:#4ade80;--warn:#fbbf24;--bad:#ff5a5a;--accent:#6e9bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:var(--tint);color:var(--fg);position:relative;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2vh 3vw;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(14px,2vw,26px);gap:1rem;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,5vw,64px);font-weight:700;outline:none}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:2vh}
#time{font-size:clamp(70px,24vw,360px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--ok);letter-spacing:.02em}
body.warn #time{color:var(--warn)}
body.bad #time{color:var(--bad)}
body.bad.run #time{animation:pulse 1s infinite}
body.done #time{color:var(--bad);animation:pulse .7s infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{width:min(90vw,1100px);height:clamp(10px,1.6vh,20px);background:var(--line);border-radius:99px;overflow:hidden}
#fill{height:100%;width:100%;background:var(--ok);transition:width .4s linear,background .4s}
body.warn #fill{background:var(--warn)}
body.bad #fill,body.done #fill{background:var(--bad)}
#msg{font-size:clamp(20px,3.6vw,48px);min-height:1.3em;outline:none;max-width:90vw}
.panel{width:min(980px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
body.hide .panel{display:none}
button,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input[type=number]{width:80px}
label{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
.sep{width:1px;height:28px;background:var(--line)}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
body{--tint:radial-gradient(circle at 15% 10%,rgba(36,87,214,.2),transparent 55%),radial-gradient(circle at 85% 90%,rgba(36,87,214,.16),transparent 55%)}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.top,.main,.bottom{position:relative;z-index:1}
.bottom{width:100%;display:flex;flex-direction:column;align-items:center}
#ico{font-size:clamp(40px,8vw,110px);line-height:1;display:none}
#ico.flip{animation:flip 3s ease-in-out infinite}
#ico.ring{animation:ring .5s infinite}
@keyframes flip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}
@keyframes ring{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
#float{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;bottom:-120px;opacity:0;animation:rise linear forwards;will-change:transform;line-height:1}
.fl img{width:100%;height:100%;object-fit:contain;border-radius:12px}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.55}50%{transform:translate(var(--sway),-55vh) rotate(var(--rot))}90%{opacity:.55}100%{transform:translate(calc(var(--sway)*-1),-120vh) rotate(calc(var(--rot)*-1));opacity:0}}
html.noanim #float{display:none}
html.noanim #ico{animation:none}
#bounce{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bn{position:absolute;left:0;top:0;opacity:0;transition:opacity .8s;height:auto;will-change:transform}
html.nobounce #bounce{display:none}
</style>
</head>
<body>
<div id="float"></div>
<div id="bounce"></div>
<div class="top"><span id="clock">--:--</span><span id="endat"></span></div>
<div class="main">
  <div id="ico">⏳</div>
  <h1 id="title" contenteditable="true" spellcheck="false">Evaluación</h1>
  <div id="time">00:00</div>
  <div class="bar"><div id="fill"></div></div>
  <div id="msg" contenteditable="true" spellcheck="false">Escribe aquí un aviso para los alumnos</div>
</div>
<div class="bottom">
  <div class="panel">
    <label>Minutos <input id="mins" type="number" min="1" max="600" value="45"></label>
    <button class="primary" id="go">Iniciar</button>
    <button id="pause">Pausar</button>
    <button id="reset">Reiniciar</button>
    <span class="sep"></span>
    <button id="p5">+5 min</button>
    <button id="m5">−5 min</button>
    <span class="sep"></span>
    <label>Terminar a las <input id="until" type="time"></label>
    <button id="setuntil">Fijar</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="snd" checked> Sonido</label>
    <button id="fs">Pantalla completa</button>
    <button id="hide">Ocultar controles</button>
    <span class="sep"></span>
    <label>Tema <select id="tema"><option value="escuela">Escuela</option><option value="espacio">Espacio</option><option value="oceano">Océano</option><option value="bosque">Bosque</option><option value="animales">Animales</option></select></label>
    <button id="img">Mis imágenes (máx. 15)</button><button id="clr">Quitar</button>
    <label><input type="checkbox" id="bnc" checked> Rebote</label><input type="file" id="file" accept="image/*" multiple hidden>
    <label><input type="checkbox" id="anim" checked> Animación</label>
  </div>
  <div class="hint">Atajos: Espacio = pausar/reanudar · F = pantalla completa · H = ocultar/mostrar controles. Haz clic en el título o el aviso para editarlos.</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var total=0,remaining=0,end=0,running=false,iv=null,warned5=false,ac=null;
  function pad(n){return String(n).padStart(2,"0")}
  function fmt(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":"+pad(m):pad(m))+":"+pad(s%60)}
  function hhmm(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
  function beep(n,f){
    if(!$("snd").checked)return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      for(var i=0;i<n;i++){
        var o=ac.createOscillator(),g=ac.createGain();
        o.frequency.value=f||880;o.connect(g);g.connect(ac.destination);
        var t=ac.currentTime+i*0.4;
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
        o.start(t);o.stop(t+0.32);
      }
    }catch(e){}
  }
  function render(){
    $("time").textContent=fmt(remaining);
    var pct=total>0?Math.max(0,remaining/total*100):0;
    $("fill").style.width=pct+"%";
    var b=document.body.classList;
    b.toggle("warn",remaining<=600&&remaining>300&&total>0);
    b.toggle("bad",remaining<=300&&remaining>0);
    b.toggle("done",total>0&&remaining<=0);
    b.toggle("run",running);
    if(running||remaining>0&&total>0){$("endat").textContent="Termina a las "+hhmm(new Date(Date.now()+remaining*1000))}
    else if(total>0){$("endat").textContent="Tiempo finalizado"}
    else $("endat").textContent="";
    var ic=$("ico"),fin=total>0&&remaining<=0;
    ic.textContent=fin?"⏰":(total>0&&remaining<=300?"⚡":"⏳");
    ic.className=fin?"ring":(running?"flip":"");
    document.title=total>0?fmt(remaining)+" · Temporizador":"Temporizador de prueba";
  }
  function tick(){
    remaining=(end-Date.now())/1000;
    if(!warned5&&remaining<=300&&remaining>0&&total>300){warned5=true;beep(2,660)}
    if(remaining<=0){remaining=0;running=false;clearInterval(iv);beep(4,880);burst();$("pause").textContent="Pausar"}
    render();
  }
  function start(sec){
    total=sec;remaining=sec;end=Date.now()+sec*1000;running=true;warned5=sec<=300;
    clearInterval(iv);iv=setInterval(tick,250);$("pause").textContent="Pausar";
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
    render();
  }
  function toggle(){
    if(total<=0||remaining<=0)return;
    if(running){running=false;clearInterval(iv);remaining=(end-Date.now())/1000;$("pause").textContent="Reanudar"}
    else{running=true;end=Date.now()+remaining*1000;iv=setInterval(tick,250);$("pause").textContent="Pausar"}
    render();
  }
  function adjust(sec){
    if(total<=0)return;
    remaining=Math.max(0,remaining+sec);total=Math.max(total+sec,remaining);
    if(running)end=Date.now()+remaining*1000;
    if(remaining>300)warned5=false;
    render();
  }
  function fullscreen(){
    if(document.fullscreenElement)document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
  }
  function hideToggle(){document.body.classList.toggle("hide")}
  $("go").onclick=function(){var m=parseFloat($("mins").value);if(m>0)start(Math.round(m*60))};
  $("pause").onclick=toggle;
  $("reset").onclick=function(){clearInterval(iv);running=false;total=0;remaining=0;$("pause").textContent="Pausar";document.body.className=document.body.classList.contains("hide")?"hide":"";render()};
  $("p5").onclick=function(){adjust(300)};
  $("m5").onclick=function(){adjust(-300)};
  $("setuntil").onclick=function(){
    var v=$("until").value;if(!v)return;
    var p=v.split(":"),d=new Date();d.setHours(+p[0],+p[1],0,0);
    var s=(d-Date.now())/1000;if(s<=0)s+=86400;
    start(Math.round(s));
  };
  $("fs").onclick=fullscreen;$("hide").onclick=hideToggle;
  document.addEventListener("keydown",function(e){
    var t=e.target;
    if(t.tagName==="INPUT"||t.tagName==="SELECT"||t.isContentEditable)return;
    if(e.code==="Space"){e.preventDefault();toggle()}
    else if(e.key==="f"||e.key==="F")fullscreen();
    else if(e.key==="h"||e.key==="H")hideToggle();
  });
  document.querySelectorAll("[contenteditable]").forEach(function(el){
    el.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();el.blur()}});
  });
  function clock(){$("clock").textContent=hhmm(new Date())}
  clock();setInterval(clock,1000);
  var TEMAS={escuela:["✏️","📚","📐","🧮","📝","🎒","💡","🔬"],espacio:["🚀","🪐","⭐","🌙","🛰️","☄️","👽","🌟"],oceano:["🐠","🐙","🐳","🐚","🌊","🦀","🐬","⚓"],bosque:["🌳","🦉","🍄","🦊","🍃","🐞","🦋","🌻"],animales:["🐶","🐱","🐼","🦁","🐸","🐵","🐰","🐧"]};
  var TINT={escuela:"36,87,214",espacio:"120,70,220",oceano:"0,150,200",bosque:"40,150,80",animales:"230,140,40"};
  var tema="escuela",custom=[];
  function spawn(fast,pre){
    var l=$("float");
    if(!l||imgs.length||document.documentElement.classList.contains("noanim"))return;
    if(!fast&&l.children.length>22)return;
    var d=document.createElement("div"),s=30+Math.random()*50;
    d.className="fl";
    d.style.cssText="left:"+(Math.random()*95)+"%;width:"+s+"px;height:"+s+"px;font-size:"+(s*0.85)+"px;--sway:"+(Math.random()*160-80)+"px;--rot:"+(Math.random()*60-30)+"deg;animation-duration:"+(fast?4+Math.random()*3:14+Math.random()*12)+"s";
    if(pre)d.style.animationDelay=(-Math.random()*14)+"s";
    if(custom.length&&Math.random()<0.35){var im=document.createElement("img");im.src=custom[Math.floor(Math.random()*custom.length)];d.appendChild(im)}
    else{var a=TEMAS[tema];d.textContent=a[Math.floor(Math.random()*a.length)]}
    d.addEventListener("animationend",function(){d.remove()});
    l.appendChild(d);
  }
  function burst(){for(var i=0;i<36;i++)setTimeout(function(){spawn(true)},i*80)}
  function applyTema(){
    var c=TINT[tema];
    document.body.style.setProperty("--tint","radial-gradient(circle at 15% 10%,rgba("+c+",.2),transparent 55%),radial-gradient(circle at 85% 90%,rgba("+c+",.16),transparent 55%)");
    $("float").innerHTML="";
    for(var i=0;i<14;i++)spawn(false,true);
  }
  $("tema").onchange=function(){tema=this.value;applyTema()};
  $("img").onclick=function(){$("file").click()};
  var imgs=[],sprites=[],last=0;
  function db(cb){try{var r=indexedDB.open("tempo",1);r.onupgradeneeded=function(){r.result.createObjectStore("k")};r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
  function save(){db(function(d){if(!d)return;try{d.transaction("k","readwrite").objectStore("k").put(imgs,"imgs")}catch(e){}})}
  function loadSaved(){db(function(d){if(!d)return;try{var q=d.transaction("k").objectStore("k").get("imgs");q.onsuccess=function(){if(q.result&&q.result.length){imgs=q.result;buildSprites()}}}catch(e){}})}
  function buildSprites(){
    var L=$("bounce");L.innerHTML="";sprites=[];
    imgs.forEach(function(src){
      var el=document.createElement("img"),s=Math.min(innerWidth,innerHeight)*(0.09+Math.random()*0.06);
      el.src=src;el.className="bn";el.style.width=s+"px";L.appendChild(el);
      sprites.push({el:el,s:s,x:0,y:0,vx:0,vy:0,a:false,rot:0,vr:Math.random()*2-1});
    });
    if(imgs.length)$("float").innerHTML="";else applyTema();
  }
  function wake(sp){
    var ang=Math.random()*Math.PI*2;
    sp.x=Math.random()*Math.max(1,innerWidth-sp.s);sp.y=Math.random()*Math.max(1,innerHeight-sp.s);
    sp.vx=Math.cos(ang);sp.vy=Math.sin(ang);sp.a=true;sp.el.style.opacity=".92";
  }
  function frame(t){
    var dt=Math.min(0.05,(t-last)/1000);last=t;
    if(sprites.length&&!document.documentElement.classList.contains("nobounce")){
      var fin=total>0&&remaining<=0,
          p=fin?1:(total>0?Math.min(1,Math.max(0,1-remaining/total)):0),
          frozen=total>0&&!running&&!fin,
          want=fin?sprites.length:Math.max(2,Math.round(sprites.length*(0.15+0.85*p))),
          mult=frozen?0:80+600*Math.pow(p,1.5);
      for(var i=0;i<sprites.length;i++){
        var sp=sprites[i];
        if(i>=want){if(sp.a){sp.a=false;sp.el.style.opacity="0"}continue}
        if(!sp.a)wake(sp);
        sp.x+=sp.vx*mult*dt;sp.y+=sp.vy*mult*dt;
        var h=sp.el.offsetHeight||sp.s,W=innerWidth-sp.s,H=innerHeight-h;
        if(sp.x<0){sp.x=0;sp.vx=Math.abs(sp.vx)}else if(sp.x>W){sp.x=W;sp.vx=-Math.abs(sp.vx)}
        if(sp.y<0){sp.y=0;sp.vy=Math.abs(sp.vy)}else if(sp.y>H){sp.y=H;sp.vy=-Math.abs(sp.vy)}
        sp.rot+=sp.vr*mult*dt*0.05;
        sp.el.style.transform="translate("+sp.x+"px,"+sp.y+"px) rotate("+sp.rot+"deg)";
      }
    }
    requestAnimationFrame(frame);
  }
  $("file").onchange=function(){
    var files=Array.prototype.slice.call(this.files,0,Math.max(0,15-imgs.length)),n=files.length;
    this.value="";
    if(!n)return;
    files.forEach(function(f){
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          var k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement("canvas");
          c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          imgs.push(c.toDataURL("image/png"));
          if(--n===0){buildSprites();save()}
        };
        im.onerror=function(){if(--n===0){buildSprites();save()}};
        im.src=r.result;
      };
      r.readAsDataURL(f);
    });
  };
  $("clr").onclick=function(){imgs=[];buildSprites();save()};
  $("bnc").onchange=function(){document.documentElement.classList.toggle("nobounce",!this.checked)};
  $("anim").onchange=function(){
    document.documentElement.classList.toggle("noanim",!this.checked);
    if(this.checked)applyTema();
  };
  setInterval(function(){spawn(false)},1100);
  loadSaved();requestAnimationFrame(frame);
  applyTema();
  render();
})();
</script>
</body>
</html>
